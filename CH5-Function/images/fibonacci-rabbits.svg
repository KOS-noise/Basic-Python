<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300"><rect width="760" height="300" rx="18" fill="#f6f8fa"/><text x="30" y="42" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#24292f">Rabbit pairs by month</text><text x="30" y="70" font-family="Arial,sans-serif" font-size="14" fill="#57606a">Each month adds the pairs from the two months before.</text><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#0969da"><circle cx="85" cy="137" r="25"/><circle cx="200" cy="137" r="25"/><circle cx="315" cy="137" r="25"/><circle cx="430" cy="137" r="25"/><circle cx="545" cy="137" r="25"/><circle cx="660" cy="137" r="25"/></g><g fill="#fff" font-size="20" font-weight="700"><text x="85" y="144">1</text><text x="200" y="144">1</text><text x="315" y="144">2</text><text x="430" y="144">3</text><text x="545" y="144">5</text><text x="660" y="144">8</text></g><g stroke="#8c959f" stroke-width="2" fill="none"><path d="M112 137h54"/><path d="M227 137h54"/><path d="M342 137h54"/><path d="M457 137h54"/><path d="M572 137h54"/></g><g fill="#57606a" font-size="13"><text x="85" y="185">month 1</text><text x="200" y="185">month 2</text><text x="315" y="185">month 3</text><text x="430" y="185">month 4</text><text x="545" y="185">month 5</text><text x="660" y="185">month 6</text></g></g><rect x="205" y="220" width="350" height="48" rx="12" fill="#ddf4ff"/><text x="380" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0550ae">next = previous + before previous</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"><rect width="900" height="400" rx="18" fill="#f6f8fa"/><text x="35" y="40" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#24292f">A function call adds a local frame</text><rect x="50" y="75" width="330" height="265" rx="14" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/><text x="215" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0550ae">Global frame</text><rect x="90" y="145" width="250" height="60" rx="8" fill="white" stroke="#8c959f"/><text x="112" y="182" font-family="Consolas,monospace" font-size="19" fill="#24292f">price = 100</text><rect x="520" y="75" width="330" height="265" rx="14" fill="#fff8c5" stroke="#bf8700" stroke-width="2"/><text x="685" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#7d4e00">Local frame: add_tax()</text><rect x="560" y="145" width="250" height="60" rx="8" fill="white" stroke="#8c959f"/><text x="582" y="182" font-family="Consolas,monospace" font-size="19" fill="#24292f">price = 100</text><rect x="560" y="220" width="250" height="60" rx="8" fill="white" stroke="#8c959f"/><text x="582" y="257" font-family="Consolas,monospace" font-size="19" fill="#24292f">tax = 10</text><path d="M380 175h128" stroke="#8250df" stroke-width="3" marker-end="url(#arr)"/><text x="444" y="158" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#57606a">call</text><text x="450" y="375" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#57606a">The local frame is removed when the function returns.</text><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8250df"/></marker></defs></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430"><rect width="900" height="430" rx="18" fill="#f6f8fa"/><text x="40" y="42" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#24292f">Two names, two different outcomes</text><rect x="30" y="70" width="410" height="320" rx="15" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/><text x="235" y="106" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0550ae">Integer: local rebinding</text><g font-family="Consolas,monospace" font-size="18" fill="#24292f"><rect x="65" y="145" width="125" height="55" rx="8" fill="#fff" stroke="#8c959f"/><text x="127" y="179" text-anchor="middle">value = 10</text><rect x="265" y="145" width="125" height="55" rx="8" fill="#fff" stroke="#8c959f"/><text x="327" y="179" text-anchor="middle">number = 10</text><path d="M190 172h68" stroke="#8250df" stroke-width="3" marker-end="url(#arrow1)"/><text x="235" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="15">inside function: number = 20</text><rect x="65" y="275" width="125" height="55" rx="8" fill="#fff" stroke="#8c959f"/><text x="127" y="309" text-anchor="middle">value = 10</text><rect x="265" y="275" width="125" height="55" rx="8" fill="#fff" stroke="#8c959f"/><text x="327" y="309" text-anchor="middle">number = 20</text><text x="235" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#57606a">The caller's name is unchanged.</text></g><rect x="460" y="70" width="410" height="320" rx="15" fill="#fff8c5" stroke="#bf8700" stroke-width="2"/><text x="665" y="106" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#7d4e00">List: shared mutation</text><g font-family="Consolas,monospace" font-size="18" fill="#24292f"><rect x="490" y="145" width="145" height="55" rx="8" fill="#fff" stroke="#8c959f"/><text x="562" y="179" text-anchor="middle">numbers</text><rect x="700" y="145" width="140" height="55" rx="8" fill="#fff" stroke="#8c959f"/><text x="770" y="179" text-anchor="middle">items</text><path d="M635 172h60" stroke="#8250df" stroke-width="3" marker-end="url(#arrow2)"/><rect x="565" y="235" width="205" height="65" rx="18" fill="#fff" stroke="#bf8700" stroke-width="2"/><text x="667" y="275" text-anchor="middle">[1, 2]</text><path d="M562 200v26" stroke="#8250df" stroke-width="3"/><path d="M770 200v26" stroke="#8250df" stroke-width="3"/><text x="665" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="15">items.append(3)</text><rect x="565" y="345" width="205" height="35" rx="12" fill="#dafbe1" stroke="#1a7f37"/><text x="667" y="369" text-anchor="middle">[1, 2, 3] — both see it</text></g><defs><marker id="arrow1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8250df"/></marker><marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8250df"/></marker></defs></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470"><rect width="900" height="470" rx="18" fill="#f6f8fa"/><text x="40" y="42" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#24292f">A simplified memory model</text><rect x="40" y="75" width="340" height="350" rx="14" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/><text x="210" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#0550ae">Stack / name table</text><text x="440" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#8250df">References</text><rect x="520" y="75" width="340" height="350" rx="14" fill="#fff8c5" stroke="#bf8700" stroke-width="2"/><text x="690" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#7d4e00">Heap / objects</text><g font-family="Consolas,monospace" font-size="17" fill="#24292f"><rect x="75" y="135" width="280" height="46" rx="7" fill="#fff" stroke="#8c959f"/><text x="95" y="164">a = 10</text><rect x="75" y="190" width="280" height="46" rx="7" fill="#fff" stroke="#8c959f"/><text x="95" y="219">b = True</text><rect x="75" y="245" width="280" height="46" rx="7" fill="#fff" stroke="#8c959f"/><text x="95" y="274">c = "Hello"</text><rect x="75" y="300" width="280" height="46" rx="7" fill="#fff" stroke="#8c959f"/><text x="95" y="329">d → ref #1</text><rect x="75" y="355" width="280" height="46" rx="7" fill="#fff" stroke="#8c959f"/><text x="95" y="384">e → ref #2</text><rect x="565" y="160" width="250" height="82" rx="18" fill="#fff" stroke="#bf8700" stroke-width="2"/><text x="690" y="193" text-anchor="middle">ref #1</text><text x="690" y="220" text-anchor="middle">[1, 2, 3, 4, 5]</text><rect x="565" y="285" width="250" height="92" rx="18" fill="#fff" stroke="#bf8700" stroke-width="2"/><text x="690" y="318" text-anchor="middle">ref #2</text><text x="690" y="344" text-anchor="middle">{"name": "Gureum"}</text><text x="690" y="366" text-anchor="middle">{"age": 6}</text></g><g fill="none" stroke="#8250df" stroke-width="3" stroke-dasharray="7 6"><path d="M355 323 C435 323 475 200 565 200"/><path d="M355 378 C445 378 470 330 565 330"/></g><text x="450" y="448" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#57606a">Names point to objects; the arrows are references.</text></svg>